<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>Travel Footprints · JLChennn</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#27333d;--muted:#727d87;--line:#e6eaee;--mint:#8fb4a6;--mint-soft:#e8f2ee;--blue:#52778e;--blue-dot:#8fa9c4;--lav-dot:#b3a2c6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.top{position:fixed;top:0;left:0;right:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(247,248,250,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.egg{font-family:Georgia,'Songti SC','Noto Serif SC',SimSun,serif;font-size:13.5px;letter-spacing:.4px;color:#5d6f7c;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:18px;flex-shrink:0}
.home-link{font-size:12px;color:var(--blue)}.home-link:hover{text-decoration:underline;text-underline-offset:3px}
.lang-switch{display:flex;padding:3px;border:1px solid #dfe5e9;border-radius:7px;gap:2px;background:transparent}
.lang-switch button{border:0;background:transparent;color:var(--muted);padding:3px 11px;font-size:11px;border-radius:4px;line-height:21px}
.lang-switch button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #26364110}
.layout{max-width:1000px;margin:0 auto;padding:98px 26px 64px;display:grid;grid-template-columns:138px minmax(0,1fr);gap:38px;align-items:start}
.region-nav{position:sticky;top:88px;display:flex;flex-direction:column;gap:9px}
.region-nav button{display:block;text-align:left;padding:11px 16px;border:1px solid var(--line);background:var(--paper);border-radius:9px;color:var(--muted);font-size:14px;transition:all .15s ease}
.region-nav button:hover{border-color:#c9d6df;color:#4d6371}
.region-nav button[aria-pressed=true]{background:var(--mint-soft);border-color:#c5ded4;color:#3d6154;font-weight:600}
main{min-width:0}
.pane.hidden{display:none}
.tl{position:relative;margin:4px 0 0 6px;border-left:1px solid #dbe3e8;padding-left:30px}
.tl-item{position:relative;margin-bottom:30px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:20px;align-items:flex-start;box-shadow:0 3px 16px #30465205}
.tl-item::before{content:'';position:absolute;left:-35px;top:25px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--mint)}
.tl-item:nth-child(2)::before{border-color:var(--blue-dot)}
.tl-item:nth-child(3)::before{border-color:var(--lav-dot)}
.tl-media{width:236px;height:150px;border-radius:10px;object-fit:cover;flex-shrink:0;display:block;background:#eef2f4}
.tl-text{min-width:0}
.tl-text p{font-size:15px;line-height:1.9;color:#45545f;margin:0 0 12px}
.tl-meta{display:flex;gap:16px;align-items:baseline}
.tl-place{font-size:13px;font-weight:600;color:var(--blue)}
.tl-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty-note{font:italic 15px/1.8 Georgia,'Songti SC',SimSun,serif;color:#9aa6ae;border-left:2px solid #dbe3e8;padding:2px 0 2px 16px;margin:0 0 0 8px}
@media(max-width:760px){
  .top{flex-wrap:wrap;height:auto;min-height:64px;padding:10px 16px;gap:6px 10px}
  .egg{width:100%;white-space:normal;overflow:visible;text-overflow:clip;font-size:12px;line-height:1.6}
  .actions{margin-left:auto;gap:12px}
  .layout{display:block;padding:124px 16px 50px}
  .region-nav{position:static;flex-direction:row;margin:0 0 22px}.region-nav button{flex:1;text-align:center;padding:12px 10px}
  .tl-item{flex-direction:column}.tl-media{width:100%;height:auto}
  .tl-text p{font-size:14px}
}
@media(max-width:420px){
  .egg{font-size:11.5px}
  .tl{padding-left:26px}
  .tl-item::before{left:-31px}
  .tl-item{padding:14px}
  .tl-meta{flex-wrap:wrap;gap:8px 12px}
  .home-link{font-size:11px}
}
</style>
</head>
<body>
<header class="top">
  <p class="egg" data-i18n="egg"></p>
  <div class="actions">
    <a class="home-link" data-i18n="backHome" href="index.html"></a>
    <div class="lang-switch" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="region-nav" aria-label="Regions / 区域">
    <button type="button" data-region="domestic" aria-pressed="true"><span data-i18n="domestic"></span></button>
    <button type="button" data-region="overseas" aria-pressed="false"><span data-i18n="overseas"></span></button>
  </nav>
  <main>
    <section id="pane-domestic" class="pane"><div class="tl" id="domestic-list"></div></section>
    <section id="pane-overseas" class="pane hidden"><div class="tl" id="overseas-list"></div></section>
  </main>
</div>
<script>
(function(){
  'use strict';
  // 左上角彩蛋文案中英双版（切换语言时同步翻译）。
  var I18N = {
    en: {
      egg: 'This is an Easter egg! — A record of measuring the world with my footsteps!',
      backHome: '← Home',
      domestic: 'Domestic', overseas: 'Overseas',
      empty: 'To be added',
      alt: 'Travel footprint photo',
      title: 'Travel Footprints · JLChennn'
    },
    zh: {
      egg: '这是一个彩蛋！——用脚步丈量世界ing的记录！',
      backHome: '← 返回主页',
      domestic: '国内', overseas: '国外',
      empty: '待补充',
      alt: '旅行足迹照片',
      title: '旅行足迹记录 · JLChennn'
    }
  };
  // 国内为占位内容（待替换），国外暂留白。
  var DATA = {
    domestic: [
      { img: 'assets/travel-nanjing-2022.jpg',
        text: { en: 'I arrived in Nanjing and spent all four college years here.', zh: '抵达南京，在这儿度过了大学四年' },
        place: { en: 'Nanjing · Jiangsu', zh: '南京 · 江苏' }, date: '2022.08' },
      { img: 'assets/travel-yunnan-2022.jpg',
        text: { en: 'Graduation trip — at eighteen, setting out into the world with my best friends.', zh: '毕业旅行——十八岁，和最好的朋友，出门远行。' },
        place: { en: 'Kunming · Dali · Lijiang · Yunnan', zh: '昆明 · 大理 · 丽江 · 云南' }, date: '2022.07' },
      { img: 'assets/travel-chuzhou-2023.jpg',
        text: { en: 'The drunkard\'s heart is not in the wine, but in the mountains and rivers.', zh: '“醉翁之意不在酒，在乎山水之间也”' },
        place: { en: 'Chuzhou · Anhui', zh: '滁州 · 安徽' }, date: '2023.06' },
      { img: 'assets/travel-zhenjiang-2023.jpg',
        text: { en: 'Just to clear my mind — but I unexpectedly fell in love with this place.', zh: '散散心，但意料之外地很喜欢这个地方' },
        place: { en: 'Zhenjiang · Jiangsu', zh: '镇江 · 江苏' }, date: '2023.12' },
      { img: 'assets/travel-chongqing-2024.jpg',
        text: { en: 'Strolling by the riverside in the mountain city, letting the evening breeze wash over me.', zh: '在山城的江边，散散步吹吹风' },
        place: { en: 'Chongqing', zh: '重庆' }, date: '2024.02' },
      { img: 'assets/travel-tianjin-2024.jpg',
        text: { en: 'Just stopped by along the way.', zh: '顺道去的。' },
        place: { en: 'Tianjin', zh: '天津' }, date: '2024.05' },
      { img: 'assets/travel-beijing-2024.jpg',
        text: { en: 'In the capital, catching up with old friends.', zh: '在首都，见见老朋友' },
        place: { en: 'Beijing', zh: '北京' }, date: '2024.05' },
      { img: 'assets/travel-xiamen-2024.jpg',
        text: { en: 'I love this seaside city!', zh: '我爱这个海边城市！' },
        place: { en: 'Xiamen · Fujian', zh: '厦门 · 福建' }, date: '2024.09' },
      { img: 'assets/travel-wuhan-2023.jpg',
        text: { en: 'Met up with an old classmate.', zh: '见了老同学。' },
        place: { en: 'Wuhan · Hubei', zh: '武汉 · 湖北' }, date: '2023.10' },
      { img: 'assets/travel-yunnan-2026.jpg',
        text: { en: 'A slow sojourn — road-tripping our way through.', zh: '旅居，自驾' },
        place: { en: "Pu'er · Mojiang · Tengchong · Mangshi · Ruili · Yunnan", zh: '普洱 · 墨江 · 腾冲 · 芒市 · 瑞丽 · 云南' }, date: '2026.02' },
      { img: 'assets/travel-chuanxi-2026.jpg',
        text: { en: 'Standing closer to the sky — are we closer to freedom? Self-driving through Western Sichuan.', zh: '站在离天空更近的地方，会不会更接近自由・川西自驾' },
        place: { en: 'Kangding · Xinduqiao · Mount Siguniang · Sichuan', zh: '康定 · 新都桥 · 四姑娘山 · 四川' }, date: '2026.08' },
      { img: 'assets/travel-chengdu-2026.jpg',
        text: { en: 'An unforgettable time.', zh: '一段难忘的时光。' },
        place: { en: 'Chengdu · Sichuan', zh: '成都 · 四川' }, date: '2026.04' },
      { img: 'assets/travel-suzhou-2023.jpg',
        text: { en: 'The water towns of Jiangnan live up to their name. Imagine owning one of these gardens — what bliss that would be.', zh: '江南水乡，名不虚传。如果能拥有一套园林该有多幸福。' },
        place: { en: 'Suzhou · Jiangsu', zh: '苏州 · 江苏' }, date: '2023.05' },
      { img: 'assets/travel-shanghai-2023.jpg',
        text: { en: 'The Magic City truly lives up to its name. Almost everyone visiting Shanghai for the first time feels a little awestruck.', zh: '魔都，名不虚传。每一个第一次来到上海的人大概都会被小小震撼一下。' },
        place: { en: 'Shanghai', zh: '上海' }, date: '2023.05' }
    ],
    overseas: []
  };
  var lang = 'en';
  var region = 'domestic';
  function t(key){ return I18N[lang][key]; }
  function render(){
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach(function(btn){ btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang)); });
    renderList();
  }
  function renderList(){
    var list = document.getElementById(region + '-list');
    // 按时间倒序：时间越新越靠前（占位日期 20XX.XX 视为最早，排在最后）。
    function dateKey(s){ return String(s).replace(/X/g, '0'); }
    var entries = DATA[region].slice().sort(function(a, b){ return dateKey(b.date).localeCompare(dateKey(a.date)); });
    var frag = document.createDocumentFragment();
    entries.forEach(function(entry, i){
      var item = document.createElement('article');
      item.className = 'tl-item';
      var img = document.createElement('img');
      img.className = 'tl-media'; img.src = entry.img; img.alt = t('alt'); img.loading = 'lazy';
      var text = document.createElement('div');
      text.className = 'tl-text';
      var p = document.createElement('p');
      p.textContent = entry.text[lang];
      var meta = document.createElement('div');
      meta.className = 'tl-meta';
      var place = document.createElement('span');
      place.className = 'tl-place'; place.textContent = entry.place[lang];
      var date = document.createElement('time');
      date.className = 'tl-date'; date.textContent = entry.date; date.dateTime = entry.date;
      meta.append(place, date);
      text.append(p, meta);
      item.append(img, text);
      frag.append(item);
    });
    list.replaceChildren(frag);
    if (entries.length === 0) {
      var note = document.createElement('p');
      note.className = 'empty-note';
      note.textContent = t('empty');
      list.append(note);
    }
  }
  document.querySelectorAll('[data-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){ lang = btn.dataset.lang; render(); });
  });
  document.querySelectorAll('[data-region]').forEach(function(btn){
    btn.addEventListener('click', function(){
      region = btn.dataset.region;
      document.querySelectorAll('[data-region]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.region === region)); });
      document.getElementById('pane-domestic').classList.toggle('hidden', region !== 'domestic');
      document.getElementById('pane-overseas').classList.toggle('hidden', region !== 'overseas');
      renderList();
    });
  });
  render();
})();
</script>
</body>
</html>
